<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ALM Multi‑QR Encoder (نسخة محسّنة)</title>

<style>
body {
  font-family: "Cairo", sans-serif;
  background: #ffffff;
  color: #222;
  margin: 0;
  padding: 0;
}

header {
  background: #0BA37F;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #0BA37F;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #0a8c6c;
}

button:active {
  transform: scale(0.98);
}

textarea, input[type="number"], input[type="file"] {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

.qr-box {
  margin: 20px 0;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  text-align: center;
  background: #fafafa;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.small {
  font-size: 13px;
  color: #666;
  margin-top: 5px;
  text-align: center;
}

.status {
  background: #f0f0f0;
  padding: 8px;
  border-radius: 8px;
  font-size: 14px;
  margin: 10px 0;
  text-align: center;
}

#qrList {
  margin-top: 20px;
}

hr {
  margin: 25px 0;
}
</style>

<!-- QRCode -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- LZ-String -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<!-- Html5Qrcode -->
<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<header>ALM Multi‑QR Encoder (إصدار احترافي)</header>

<div class="container">

<h3>إدخال نص أو كتاب</h3>

<textarea id="inputText" rows="5" placeholder="اكتب نصًا هنا (للنصوص القصيرة فقط)..."></textarea>

<label>أو حمّل كتاب PDF:</label>
<input type="file" id="pdfInput" accept="application/pdf">

<label>مفتاح المستخدم:</label>
<input id="userKey" type="number" value="123456789">

<button onclick="startEncoding()">تحويل إلى باركودات متعددة</button>
<div id="encodingStatus" class="status"></div>

<div id="qrList"></div>

<hr>

<h3>فكّ الباركودات</h3>

<label>اختر صورة أو عدة صور QR:</label>
<input type="file" id="qrFiles" accept="image/*" multiple>

<button onclick="decodeSingleQR()">استخراج نص من صورة واحدة</button>
<button onclick="decodeMultipleQR()">فكّ جميع الباركودات ودمجها</button>

<h4>النص النهائي / النص المستخرج:</h4>
<div id="finalOutput" style="padding:10px; white-space:pre-wrap; border:1px solid #ccc; border-radius:8px; min-height:80px; background:#fefefe;"></div>

<!-- مخفي لقارئ Html5Qrcode -->
<div id="singleReader" style="display:none;"></div>

</div>

<script>
/* ============================================================
   نواة ALM - محسن مع ضغط كامل وتقسيم ذكي
============================================================ */
const B = 32;
const LMAX = 12;
const f0 = 100000n;
const df = 1n;

const indexToChar = {
  0:"",1:"ا",2:"ب",3:"ت",4:"ث",5:"ج",6:"ح",7:"خ",
  8:"د",9:"ذ",10:"ر",11:"ز",12:"س",13:"ش",14:"ص",
  15:"ض",16:"ط",17:"ظ",18:"ع",19:"غ",20:"ف",21:"ق",
  22:"ك",23:"ل",24:"م",25:"ن",26:"ه",27:"و",28:"ي",
  29:"ء"
};

const charToIndex = {};
for (const [i,ch] of Object.entries(indexToChar)) {
  if (ch) charToIndex[ch] = parseInt(i, 10);
}

function normalizeArabic(s) {
  return (s || "")
    .replace(/[إأآ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ة/g, "ه")
    .replace(/[^ءاأإآبتثجحخدذرزسشصضطظعغفقكلمنهوي\s]/g, "");
}

function bigIntToBase36(n) { return n.toString(36); }

function base36ToBigInt(str) {
  let res = 0n;
  for (let i = 0; i < str.length; i++) {
    const v = BigInt(parseInt(str[i], 36));
    res = res * 36n + v;
  }
  return res;
}

function splitWord(word) {
  const blocks = [];
  for (let i = 0; i < word.length; i += LMAX) {
    blocks.push(word.slice(i, i + LMAX));
  }
  return blocks;
}

function wordToCode(word){
  const c = new Array(LMAX).fill(0);
  let pos = 0;
  for (let i = word.length - 1; i >= 0; i--){
    const idx = charToIndex[word[i]];
    if (idx === undefined) continue;
    c[pos++] = idx;
  }
  let C = 0n;
  for (let i = 0; i < LMAX; i++){
    C += BigInt(c[i]) * (BigInt(B) ** BigInt(i));
  }
  return C;
}

function codeToWord(Cbig){
  let C = BigInt(Cbig);
  const digits = [];
  for (let i = 0; i < LMAX; i++){
    digits.push(Number(C % BigInt(B)));
    C /= BigInt(B);
  }
  let w = "";
  for (let i = LMAX - 1; i >= 0; i--){
    w += indexToChar[digits[i]] || "";
  }
  return w;
}

/* ============================================================
   استخراج نص PDF
============================================================ */
async function extractPDFText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const strings = content.items.map(item => item.str).join(" ");
    fullText += strings + " ";
  }
  return normalizeArabic(fullText);
}

/* ============================================================
   تحويل النص الكامل إلى سلسلة من رموز base36 (مفصولة بفواصل)
============================================================ */
function encodeFullTextToCodes(text, key) {
  const words = text.split(/\s+/);
  const codesList = [];
  for (let word of words) {
    const blocks = splitWord(word);
    for (let block of blocks) {
      const C = wordToCode(block);
      const C2 = C ^ key;
      const fFull = f0 + C2 * df;
      codesList.push(bigIntToBase36(fFull));
    }
  }
  return codesList.join(",");
}

/* ============================================================
   فك سلسلة الرموز إلى نص عربي
============================================================ */
function decodeChunkToText(rawCodes, key) {
  const freqs36 = rawCodes.split(",");
  const words = [];
  for (let f36 of freqs36) {
    if (!f36) continue;
    const fFull = base36ToBigInt(f36);
    const C2 = (fFull - f0) / df;
    const C = C2 ^ key;
    words.push(codeToWord(C));
  }
  return words.join(" ");
}

/* ============================================================
   الترميز إلى عدة باركودات (ضغط كامل ثم تقسيم ذكي)
============================================================ */
async function startEncoding() {
  const key = BigInt(document.getElementById("userKey").value || "0");
  let text = document.getElementById("inputText").value.trim();
  const pdfFile = document.getElementById("pdfInput").files[0];
  
  if (pdfFile) {
    document.getElementById("encodingStatus").innerHTML = "⏳ جاري استخراج النص من PDF...";
    text = await extractPDFText(pdfFile);
  }

  if (!text) {
    alert("لا يوجد نص للترميز.");
    document.getElementById("encodingStatus").innerHTML = "";
    return;
  }

  document.getElementById("encodingStatus").innerHTML = "⏳ جاري تحويل النص إلى رموز...";
  
  // 1. تحويل النص الكامل إلى رموز base36
  const fullCodes = encodeFullTextToCodes(text, key);
  
  // 2. ضغط الناتج (LZString)
  const compressed = LZString.compressToEncodedURIComponent(fullCodes);
  
  // 3. تقسيم النص المضغوط إلى أجزاء مناسبة للـ QR (أقصى طول 1800 حرف، لأن QR code يدعم ~2950 حرف رقمي، لكننا نستخدم أحرف URI)
  const MAX_CHUNK_SIZE = 1800; // قيمة آمنة لجميع أجهزة QR
  const parts = [];
  for (let i = 0; i < compressed.length; i += MAX_CHUNK_SIZE) {
    parts.push(compressed.slice(i, i + MAX_CHUNK_SIZE));
  }
  const total = parts.length;
  
  document.getElementById("qrList").innerHTML = "";
  document.getElementById("encodingStatus").innerHTML = `✨ تم التقسيم إلى ${total} باركود (ضغط بنسبة ${Math.round((1 - compressed.length / fullCodes.length)*100)}%، حجم مضغوط ${compressed.length} حرف)`;
  
  for (let i = 0; i < total; i++) {
    const header = `part=${i+1}/${total}|`;
    const finalData = header + parts[i];
    
    const box = document.createElement("div");
    box.className = "qr-box";
    box.innerHTML = `<h4>الجزء ${i+1} من ${total}</h4>`;
    const qrDiv = document.createElement("div");
    box.appendChild(qrDiv);
    
    // استخدام مستوى تصحيح خطأ L لأقصى سعة
    new QRCode(qrDiv, {
      text: finalData,
      width: 240,
      height: 240,
      correctLevel: QRCode.CorrectLevel.L
    });
    
    const saveBtn = document.createElement("button");
    saveBtn.textContent = "💾 حفظ الباركود";
    saveBtn.onclick = () => saveSpecificQR(qrDiv);
    box.appendChild(saveBtn);
    
    const shareBtn = document.createElement("button");
    shareBtn.textContent = "📤 مشاركة الباركود";
    shareBtn.onclick = () => shareSpecificQR(qrDiv);
    box.appendChild(shareBtn);
    
    document.getElementById("qrList").appendChild(box);
  }
}

/* ============================================================
   حفظ ومشاركة QR (دون تغيير)
============================================================ */
function saveSpecificQR(qrDiv) {
  const img = qrDiv.querySelector("img");
  const canvas = qrDiv.querySelector("canvas");
  let dataUrl = null;
  if (img && img.src) dataUrl = img.src;
  else if (canvas) dataUrl = canvas.toDataURL("image/png");
  if (!dataUrl) return;
  const a = document.createElement("a");
  a.href = dataUrl;
  a.download = "alm-qr.png";
  a.click();
}

async function shareSpecificQR(qrDiv) {
  const img = qrDiv.querySelector("img");
  const canvas = qrDiv.querySelector("canvas");
  let dataUrl = null;
  if (img && img.src) dataUrl = img.src;
  else if (canvas) dataUrl = canvas.toDataURL("image/png");
  if (!dataUrl) return;
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  const file = new File([blob], "alm-qr.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    await navigator.share({ files: [file], title: "ALM QR", text: "باركود من كتاب ALM" });
  } else {
    alert("المشاركة غير مدعومة على هذا الجهاز.");
  }
}

/* ============================================================
   فك باركود واحد فقط (لصورة واحدة)
============================================================ */
async function decodeSingleQR() {
  const files = document.getElementById("qrFiles").files;
  if (!files.length) {
    alert("اختر صورة QR أولاً.");
    return;
  }
  const file = files[0];
  const reader = new Html5Qrcode("singleReader");
  try {
    const result = await reader.scanFile(file, true);
    // نستخرج البيانات بعد الـ header
    const partsData = result.split("|");
    if (partsData.length < 2) throw new Error("تنسيق غير صالح");
    const compressedData = partsData.slice(1).join("|"); // في حال وجود أكثر من |
    const decompressed = LZString.decompressFromEncodedURIComponent(compressedData);
    const key = BigInt(document.getElementById("userKey").value || "0");
    const decodedText = decodeChunkToText(decompressed, key);
    document.getElementById("finalOutput").textContent = 
      "📄 (من باركود واحد فقط)\n" + decodedText;
  } catch(e) {
    alert("فشل في قراءة الباركود: " + e.message);
  }
  reader.clear();
}

/* ============================================================
   فك عدة باركودات ودمجها (مع إعادة بناء النص المضغوط الكامل)
============================================================ */
async function decodeMultipleQR() {
  const files = document.getElementById("qrFiles").files;
  if (!files.length) {
    alert("اختر صور QR أولاً.");
    return;
  }
  
  const partsMap = new Map(); // رقم الجزء -> البيانات المضغوطة (بدون header)
  let totalParts = 0;
  const reader = new Html5Qrcode("singleReader");
  
  for (let file of files) {
    try {
      const result = await reader.scanFile(file, true);
      const firstPipe = result.indexOf("|");
      if (firstPipe === -1) continue;
      const header = result.substring(0, firstPipe);
      const data = result.substring(firstPipe + 1);
      const match = header.match(/part=(\d+)\/(\d+)/);
      if (match) {
        const partNum = parseInt(match[1]);
        totalParts = parseInt(match[2]);
        partsMap.set(partNum, data);
      }
    } catch(e) { /* تجاهل الصور غير الصالحة */ }
  }
  
  reader.clear();
  
  if (totalParts === 0 || partsMap.size === 0) {
    alert("لم يتم العثور على باركودات صالحة.");
    return;
  }
  
  // إعادة بناء النص المضغوط الكامل بالترتيب
  let fullCompressed = "";
  for (let i = 1; i <= totalParts; i++) {
    if (partsMap.has(i)) {
      fullCompressed += partsMap.get(i);
    } else {
      fullCompressed += ""; // في حالة فقد جزء، يمكن إضافة علامة
    }
  }
  
  if (fullCompressed.length === 0) {
    alert("البيانات غير مكتملة أو تالفة.");
    return;
  }
  
  const decompressed = LZString.decompressFromEncodedURIComponent(fullCompressed);
  if (!decompressed) {
    alert("فشل فك الضغط. تأكد من أن جميع الأجزاء سليمة.");
    return;
  }
  
  const key = BigInt(document.getElementById("userKey").value || "0");
  const finalText = decodeChunkToText(decompressed, key);
  document.getElementById("finalOutput").textContent = finalText;
}
</script>

</body>
</html>
